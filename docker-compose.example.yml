services:
  picg:
    image: ${PICG_IMAGE:-picg:latest}
    container_name: picg
    restart: unless-stopped
    ports:
      - "${PICG_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      PIC_DIR: /app/pic
      PICG_DATABASE: /app/app.sqlite
      PICG_THUMBNAILS: /app/thumbnails
    volumes:
      # Persists app.sqlite and generated thumbnails across upgrades.
      - picg-data:/app
      # Put photos under ./pic, or set PICG_PHOTOS_PATH in your environment.
      - ${PICG_PHOTOS_PATH:-./pic}:/app/pic:ro

volumes:
  picg-data:
